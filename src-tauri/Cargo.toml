[package]
name = "proofreader"
version = "0.16.0"
edition = "2021"

[lib]
name = "proofreader_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 本地 LLM 推理引擎（Phase 2）。启用后编译 llama.cpp，需 cmake 与 C++ 工具链。
# macOS 启用 Metal 加速：cargo build --features local-llm
local-llm = ["dep:llama-cpp-2"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
dirs = "5"
sha2 = "0.10"
# llama.cpp Rust 绑定（本地模型推理，metal feature 启用 macOS GPU 加速）
llama-cpp-2 = { version = "0.1", features = ["metal"], optional = true }
# HTTP 客户端（模型下载，流式）
# 使用 rustls 替代 native-tls，避免 Android 交叉编译时找不到 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
# 系统信息（内存/磁盘检测）
libc = "0.2"
