# ============================================================
# 小说校对工具：容器化运行 + 浏览器访问
# 启动：docker compose up -d --build
# 访问：http://127.0.0.1:6080/vnc.html?autoconnect=true&resize=scale
# ============================================================
services:
  proofreader:
    build:
      context: .
      args:
        # 1 = 编译内置 llama.cpp 推理（镜像更大、构建更慢）；0 = 仅云端/外部推理
        WITH_LOCAL_LLM: ${WITH_LOCAL_LLM:-1}
        # apt 镜像源，国内容器构建建议保持默认；置空则使用 archive.ubuntu.com
        UBUNTU_MIRROR: ${UBUNTU_MIRROR:-mirrors.aliyun.com}
        # cargo 编译并发数，内存不足时调低可避免 OOM
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-4}
        # Rust 工具链下载源，默认 rsproxy 国内镜像
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://rsproxy.cn}
        # rustup-init 本体下载源
        RUSTUP_UPDATE_ROOT: ${RUSTUP_UPDATE_ROOT:-https://rsproxy.cn/rustup}
    # 可直接使用 GHCR / Docker Hub 镜像：
    # PROOFREADER_IMAGE=ghcr.io/<owner>/novel-proofreader PROOFREADER_VERSION=0.21.0 docker compose up -d --no-build
    # 或导入 CI 导出的 tar 包后使用：docker load -i novel-proofreader-0.21.0.tar
    image: ${PROOFREADER_IMAGE:-novel-proofreader}:${PROOFREADER_VERSION:-0.21.0}
    container_name: novel-proofreader
    ports:
      # 网页版（noVNC）：浏览器访问 http://<宿主机IP>:6080/vnc.html?autoconnect=true&resize=scale
      - "${NOVNC_PORT:-6080}:6080"
      # 原生 VNC（可选）；未设置 VNC_PASSWORD 时不要对外暴露
      - "${VNC_PORT:-5900}:5900"
    environment:
      RESOLUTION: ${RESOLUTION:-1600x1000x24}
      TZ: ${TZ:-Asia/Shanghai}
      # 对外暴露时强烈建议设置密码
      VNC_PASSWORD: ${VNC_PASSWORD:-}
    volumes:
      # 小说库、配置与本地 TTS 运行时都保存在这两个目录
      - proofreader-data:/home/app/.local/share
      - proofreader-config:/home/app/.config
      # 模型目录单独挂载：便于备份、复用，不随数据卷一起膨胀
      - proofreader-models:/home/app/.local/share/cn.helilab.proofreader/novel-proofreader/models
      # 将宿主机小说目录挂载进来后，可在应用的文件选择器中直接打开
      # - ./novels:/home/app/novels:ro
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  proofreader-data:
  proofreader-config:
  proofreader-models:
