name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04
            target: aarch64-linux-android
            android: true
            android_arch: aarch64
          - platform: ubuntu-22.04
            target: armv7-linux-androideabi
            android: true
            android_arch: armv7
          - platform: ubuntu-22.04
            target: x86_64-linux-android
            android: true
            android_arch: x86_64

    runs-on: ${{ matrix.platform }}

    env:
      # --- 发布签名材料（全部来自仓库 Secrets，由 composite action 还原到工作区） ---
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
      AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
      AZURE_CODE_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_CERTIFICATE_PROFILE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Windows targets and tools
        if: matrix.platform == 'windows-latest'
        run: |
          rustup target add ${{ matrix.target }}
          choco install nuget.commandline
        shell: powershell

      - name: Install Android targets
        if: matrix.android
        run: rustup target add ${{ matrix.target }} aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install non-Android targets
        if: "!matrix.android"
        run: rustup target add ${{ matrix.target }}

      - name: Setup Java for Android
        if: matrix.android
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.android
        uses: android-actions/setup-android@v4
        with:
          packages: >
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest
            ndk;25.1.8937393
          accept-android-sdk-licenses: true

      - name: Install cargo-ndk
        if: matrix.android
        run: cargo install cargo-ndk

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' && !matrix.android
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Android Linux dependencies
        if: matrix.android
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk libc6-dev libstdc++-10-dev

      # --frozen-lockfile：依赖版本必须由 pnpm-lock.yaml 唯一确定，否则产物不可复现
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        if: matrix.android
        run: |
          cd src-tauri
          pnpm tauri android init
        env:
          TAURI_ANDROID_MIN_SDK_VERSION: 24

      # 必须在 android init 之后执行：init 可能重生成 gen/android，
      # 该 action 会幂等地把签名与可复现补丁重新贴回项目文件。
      - name: Setup release signing
        uses: ./.github/actions/setup-release-signing
        with:
          restore-android: ${{ matrix.android }}
          require-signing: ${{ github.event_name == 'push' }}

      - name: Build Tauri app for Android
        if: matrix.android
        run: |
          set -euo pipefail
          cd src-tauri
          # 使用 lockfile 中固定的 tauri CLI（pnpm tauri），而不是 cargo install 到的最新版，
          # 否则 CLI 版本漂移会直接改变打包结果。
          pnpm tauri android build --target ${{ matrix.android_arch }}
        env:
          TAURI_ANDROID_MIN_SDK_VERSION: 24

      # AGP 的输出路径随版本变化，且 --unsigned 产物意味着签名补丁没生效；
      # 这两件事都交给脚本判断，避免写死路径导致"静默发出未签名包"。
      - name: Verify signing and normalize Android artifact names
        if: matrix.android
        run: node scripts/rename-android-artifacts.mjs --arch=${{ matrix.android_arch }}

      - name: Normalize Android archives and generate manifest
        if: matrix.android
        run: |
          node scripts/build-release.mjs \
            --android --android-arch=${{ matrix.android_arch }} --skip-build \
            --out=release-manifest-${{ matrix.target }}.json

      - name: Build Tauri app for desktop
        if: "!matrix.android"
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} ${{ env.DSH_TAURI_CONFIG_ARGS }}

      - name: Generate artifact manifest
        if: "!matrix.android"
        run: |
          node scripts/build-release.mjs --target=${{ matrix.target }} --skip-build \
            --out=release-manifest-${{ matrix.target }}.json

      - name: Verify artifacts are signed
        run: node scripts/verify-artifacts.mjs signed --manifest=release-manifest-${{ matrix.target }}.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            src-tauri/gen/android/app/build/outputs/apk/**/*
            src-tauri/gen/android/app/build/outputs/bundle/**/*
            release-manifest-${{ matrix.target }}.json
          retention-days: 7
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge per-target manifests
        run: |
          set -euo pipefail
          INPUTS=$(ls artifacts/release-manifest-*.json | paste -sd, -)
          echo "合并: $INPUTS"
          node scripts/artifact-manifest.mjs merge --inputs="$INPUTS" --out=artifacts/release-manifest.json

      - name: Verify merged manifest is fully signed
        run: node scripts/verify-artifacts.mjs signed --manifest=artifacts/release-manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.sig
            artifacts/release-manifest.json
          generate_release_notes: true
