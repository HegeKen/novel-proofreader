# ============================================================
# 构建并推送 Docker 镜像
# 触发：推送 v* 标签、手动运行
# 默认推送 GHCR；配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后同时推送 Docker Hub
# ============================================================
name: Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      # 可选：配置后同时推送 Docker Hub
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Prepare image tags
        id: prep
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          REPO_LOWER=$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${REPO_LOWER}"

          TAGS="${GHCR_IMAGE}:${VERSION}"$'\n'"${GHCR_IMAGE}:sha-${SHORT_SHA}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS="${TAGS}"$'\n'"${GHCR_IMAGE}:latest"
          fi

          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            HUB_USER_LOWER=$(printf '%s' "${DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]')
            HUB_IMAGE="docker.io/${HUB_USER_LOWER}/novel-proofreader"
            TAGS="${TAGS}"$'\n'"${HUB_IMAGE}:${VERSION}"$'\n'"${HUB_IMAGE}:sha-${SHORT_SHA}"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              TAGS="${TAGS}"$'\n'"${HUB_IMAGE}:latest"
            fi
          fi

          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'tags<<EOF\n%s\nEOF\n' "$TAGS" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 原生 x86_64 构建，避免在 Apple Silicon 上通过 QEMU 编译 llama.cpp
          platforms: linux/amd64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            WITH_LOCAL_LLM=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write summary
        run: |
          {
            echo "### Docker 镜像已推送"
            echo ""
            echo "- 版本：\`${{ steps.prep.outputs.version }}\`"
            echo "- 标签："
            echo '```'
            echo "${{ steps.prep.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
