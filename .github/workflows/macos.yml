name: Build macOS

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # 未配置有效签名 key 时允许 unsigned 产物（可在 Secrets 中设 false 强制签名）
      DSH_ALLOW_UNSIGNED: ${{ secrets.DSH_ALLOW_UNSIGNED || 'true' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install targets
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup release signing
        uses: ./.github/actions/setup-release-signing
        with:
          restore-android: "false"
          require-signing: "false"
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-api-key: ${{ secrets.APPLE_API_KEY }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple-api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: Build Tauri app for desktop
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} ${{ env.DSH_TAURI_CONFIG_ARGS }}

      - name: Generate artifact manifest
        run: |
          node scripts/build-release.mjs --target=${{ matrix.target }} --skip-build \
            --out=release-manifest-${{ matrix.target }}.json

      - name: Verify artifacts are signed
        run: node scripts/verify-artifacts.mjs signed --manifest=release-manifest-${{ matrix.target }}.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            release-manifest-${{ matrix.target }}.json
          retention-days: 7
          compression-level: 0

  # ========== 内置模型推理版本（--features local-llm） ==========
  build-local-llm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # 未配置有效签名 key 时允许 unsigned 产物（可在 Secrets 中设 false 强制签名）
      DSH_ALLOW_UNSIGNED: ${{ secrets.DSH_ALLOW_UNSIGNED || 'true' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install targets
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup release signing
        uses: ./.github/actions/setup-release-signing
        with:
          restore-android: "false"
          require-signing: "false"
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-api-key: ${{ secrets.APPLE_API_KEY }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple-api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: Build Tauri app with local-llm
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} ${{ env.DSH_TAURI_CONFIG_ARGS }} --features local-llm

      - name: Rename bundle files with local-llm suffix
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BUNDLE_DIR" -type f \( -name "*.dmg" -o -name "*.app" -o -name "*.sig" \) | while read -r f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            name="${base%.*}"
            ext="${base##*.}"
            mv "$f" "$dir/${name}-local-llm.${ext}"
          done

      - name: Generate artifact manifest
        run: |
          node scripts/build-release.mjs --target=${{ matrix.target }} --skip-build \
            --out=release-manifest-${{ matrix.target }}-local-llm.json

      - name: Upload artifacts (local-llm)
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}-local-llm
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-local-llm.*
            release-manifest-${{ matrix.target }}-local-llm.json
          retention-days: 7
          compression-level: 0

  release:
    needs: [build, build-local-llm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge per-target manifests
        run: |
          set -euo pipefail
          INPUTS=$(ls artifacts/release-manifest-*.json | paste -sd, -)
          node scripts/artifact-manifest.mjs merge --inputs="$INPUTS" --out=artifacts/release-manifest.json

      - name: Verify merged manifest is fully signed
        run: node scripts/verify-artifacts.mjs signed --manifest=artifacts/release-manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app
            artifacts/**/*.sig
            artifacts/release-manifest.json
          generate_release_notes: true
